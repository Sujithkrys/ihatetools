<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .light { display: inline; }
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" href="/logo-light.png" x="0" y="0" width="48" height="48" />
  <image class="dark" href="/logo-dark.png" x="0" y="0" width="48" height="48" />
</svg>
